# Maliyetine.com.tr - Kaynak Kaydı
#
# Yeni site eklemek = buraya birkaç satır eklemek, kod yazmak degil.
# motor.py bu dosyayi okur, her "aktif: true" kaynagi sirayla isler.
#
# Alanlar:
#   ad              : benzersiz, okunabilir isim (log ve dosya adlarinda kullanilir)
#   site            : BAGIMSIZ KAYNAK kimligi (ör. "akakce", "dolap", "atasay").
#                      COK KAYNAK KURALI/capraz dogrulama bu alana gore
#                      gruplanir - ayni "site" degerine sahip birden fazla
#                      girdi (ör. Akakce'nin 5 alt kategorisi) TEK kaynak
#                      sayilir, cunku ayni sitenin fiyat politikasini
#                      yansitirlar. Kucuk harf, bosluksuz (slug).
#   url             : hedef sayfa. Sayfalama varsa {page} yer tutucusu icerir.
#   render_gerekli  : true ise sayfa `requests` yerine gercek Chromium
#                      (Playwright) ile cekilir. Sadece WAF/TLS-parmak-izi
#                      korumasi requests'i 403 ile reddeden sitelerde
#                      kullan (Akakce, Trendyol - 2026-07-24'te dogrulandi).
#                      Varsayilan false/yok. Kurulum: playwright install chromium
#   sayfa_sayisi    : kac sayfa gezilecek (varsayilan 1 - bkz. Akakce notu asagida)
#   vertikal        : "dugun" | "tadilat" | ...
#   kalem           : bu vertikal icindeki alt kalem (ör. "gelinlik", "salon")
#   yontem          : "otomatik" (JSON-LD -> microdata -> css sirayla dener, onerilen)
#   css_secicileri  : yontem css'e duserse kullanilir. null ise css katmani atlanir.
#   min_fiyat       : bu fiyatin altindaki sonuclar cop veri sayilip elenir
#   bekleme_sn      : bu kaynaga istekler arasi bekleme (nazik kazima)
#   aktif           : false ise motor.py bu kaynagi atlar
#   durum           : "arastirildi" | "onaylandi" | "reddedildi" | "birakildi"
#                      ("birakildi" = teknik olarak kazinabilir olabilir ama
#                      su an bilerek pasif birakildi, ör. Cloudflare gibi
#                      agresif bot korumasi - reddedildi'den farki: robots.txt
#                      ONAY veriyor, engel baska bir katmanda) - insan notu
#   notlar          : serbest metin
#
# COK KAYNAK KURALI (CLAUDE.md): kalem basina en az 2, ideal 3 BAGIMSIZ
# site hedeflenir (karsilastirma sitesi + marka magazasi + ikinci el/
# sektor platformu gibi farkli tipler). motor.py ayni (vertikal, kalem)
# icin >=2 saglikli site varsa medyanlarini karsilastirir, fark %30'u
# asarsa uyari yazar (bkz. capraz_dogrula() motor.py).

