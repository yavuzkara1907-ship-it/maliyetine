  # robots.txt ONAY veriyor (protego ile dogrulandi - "Allow: /" ama
  # "Disallow: /*?sayfa=*" ve "/*,*,1..7.html" -> SAYFALAMA YASAK, bu
  # yuzden her kategori tek sayfa (sayfa_sayisi: 1), dar kategorilere
  # bolunerek tanimlandi).
  # AMA: Akakce Cloudflare bot-dogrulamasi ("Bir dakika lutfen...") ile
  # korunuyor - Playwright (gercek Chromium) ile bile GERCEK ICERIK
  # DEGIL, Cloudflare'in JS-challenge sayfasi donuyor (2026-07-24,
  # sayfa_tani.py ile ham HTML incelenerek dogrulandi). Bu robots.txt
  # meselesi degil - WAF seviyesinde aktif bot tespiti. Bunu asmak
  # (stealth eklentileri, captcha cozum servisi vb.) "nazik kazima"
  # ilkesinden uzaklasip aktif tespit atlatmaya kayar - Yavuz ile
  # konusuldu, KARAR: su an icin BIRAKILDI, tum 9 Akakce girdisi
  # aktif:false. Ileride resmi veri anlasmasi olursa yeniden
  # degerlendirilebilir (bkz. CLAUDE.md "Bilinen kaynak kisiti").
  - ad: "Akakce - Gelinlik (genel)"
    site: "akakce"
    url: "https://www.akakce.com/gelinlik.html"
    render_gerekli: true  # requests 403 aliyor (WAF/TLS parmak izi) - Playwright gerekli
    sayfa_sayisi: 1
