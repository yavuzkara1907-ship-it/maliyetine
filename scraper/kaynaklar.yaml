  # --- YEMEK BEDELI: ayni mekanin yemekli/kokteyl fiyat farkindan olculur ---
  # Onceden bu kalem "tahmini" idi (WebSearch'ten 700 TL/kisi). Salon
  # detay sayfalari kazinabilir olunca ORCULEBILIR hale geldi ve tahminin
  # 2.8 KAT sapmis oldugu ortaya cikti (gercek fark medyani ~250 TL/kisi).
  # KIRMIZI CIZGI kurali geregi tahmini listeden cikarilip gercek kaynaga
  # tasindi. Fark AYNI SAYFADA aliniyor (bkz. motor.detay_urunler fark
  # modu) - iki ayri kalemin medyanini cikarmak yaniltici olurdu.
  - ad: "DugunBuketi - Yemek Bedeli (yemekli - kokteyl farki)"
    site: "dugunbuketi"
    url: "https://dugunbuketi.com/c/dugun-mekanlari/istanbul"
    sayfa_sayisi: 1
    vertikal: "dugun"
    kalem: "yemek-ikram"
    yontem: "otomatik"
    detay:
      link_secici: ".bg-card a[href*='/fiyati/']"
      fiyat_regex: "Yemekli kişi başı\\s*₺([\\d.,]+)"
      cikarilacak_regex: "Kokteyl kişi başı\\s*₺([\\d.,]+)"
      en_fazla_detay: 12
    min_fiyat: 50
    bekleme_sn: 3
    aktif: true
    durum: "onaylandi"
    notlar: >
      Mekanin KENDI iki fiyati arasindaki fark = o mekanda yemegin kisi
      basi bedeli. Ornek (2026-07-25): Bambi Garden 750-500=250,
      Bogaz Garden 1200-280=920, Grand Anka 1000-800=200,
      Kir Kubbe 1400-990=410, Incisu 2250-2000=250 -> medyan 250 TL.
      Kokteyl secenegi sunmayan mekan atlanir (fark hesaplanamaz).
      Kokteyl > yemekli cikarsa (tutarsiz veri) atlanir ve loglanir.
      NOT: bu, MEKANIN kendi menu bedelidir - disaridan bagimsiz catering
      fiyati DEGIL. Kokteyl secip disaridan catering getirilirse tutar
      farkli olabilir; metodoloji sayfasinda belirtiliyor.

