  # =========================================================
  # KIRTASIYE ZINCIRLERI (2026-08-01, Yavuz: "kirtasiye kismi iyi
  # tiklama getirecek gibi. D&R, Nezih kirtasiye ya da birkac yerden
  # daha veri cekmeyi dener misin")
  #
  # Okul vertikalinin 14 kaleminin TAMAMI pazaryerinden (trendyol +
  # amazon) geliyordu. Kirtasiye zinciri FARKLI BIR PAZAR: marka
  # karmasi ve fiyat bandi pazaryerinden belirgin ayriliyor, yani COK
  # KAYNAK KURALI'nin istedigi turden gercek bir ikinci bakis acisi.
  #
  # ELENENLER ve sebepleri (tekrar denenmesin diye):
  #   - ofix     : SARI cikti, teknik olarak cok temiz (115 fiyatin
  #                114'u urun kartinin icinde) AMA B2B ofis tedarikcisi
  #                ve fiyatlari KDV HARIC gosteriyor ("57,45 TL + KDV").
  #                Pazaryerinin KDV dahil fiyatiyla ayni endekse koymak
  #                sistematik hata olurdu.
  #   - dr/matara: "termos ve mataralar" kategorisi Stanley tipi TERMOS
  #                iceriyor; bizim kalem ogrenci sulugu. Farkli urun.
  #   - dr/okul-cantasi: ham HTML'de 1 urun (gerisi JS) - orneklem yok.
  #   - nezih/kuru-boya-kalemleri: bizim `kalem` kalemi KURSUN kalem
  #                seti; kuru boya farkli urun.
  #   - kitapyurdu, bkmkitap: kategori sayfasinda fiyat yok (JS).
  #
  # NEZIH'TE SINIF ADLARI TERS - dikkat:
  #     .currentPrice    = ODENEN fiyat            (499,90)
  #     .discountedPrice = ustu cizili liste fiyat (699,90)
  #   Adina bakip .discountedPrice secilseydi endeks sistematik olarak
  #   sisirilirdi. Uc urunde tek tek dogrulandi.
  #
  # D&R kategori sayfasinda fiyat KARTTAN 6 KAT DERINDE; kaynak_tara.py
  # bu yuzden "fiyat kart disinda" deyip KIRMIZI vermisti. Sezgisel
  # tarayicinin KIRMIZI'si kesin sonuc degil - elle bakinca cozuldu.
  # =========================================================

  - ad: "Nezih - Defter ve Bloknotlar"
    site: nezih
    vertikal: okul
    kalem: defter
    url: "https://www.nezih.com.tr/defter-ve-bloknotlar"
    aktif: true
    durum: onaylandi
    min_fiyat: 15
    bekleme_sn: 2
    sayfa_sayisi: 1
    css_secicileri:
