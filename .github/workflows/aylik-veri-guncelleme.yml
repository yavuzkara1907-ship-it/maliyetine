name: Aylık Veri Güncelleme

# Kazıma -> birleştirme -> statik sayfa üretimi zincirini otomatikleştirir
# (bkz. CLAUDE.md "Modüller" -> 6. Aylık otomasyon). Sıra:
#   motor.py (kazıma) -> agrega.py (birleştirme) -> sayfa_uret.py (statik HTML)
# Zamanlanmış tetikleyici SADECE varsayılan (default) branch'teki workflow
# dosyasından çalışır. Varsayılan branch değişirse bu workflow da aynı
# branch'te kalmalı; workflow_dispatch elle tetiklenebilir.

on:
  schedule:
    # AYDA İKİ KEZ (2026-07-26, Yavuz'un kararı): ayın 5'i ve 20'si.
    # Neden: zaman serisi bu projenin kopyalanamaz tek varlığı. Kaynakları
    # gören biri aynı endeksi iki haftada kurar, ama geçmişe dönüp
    # 2026 Temmuz'un fiyatını toplayamaz. Ölçüm sıklığını iki katına
    # çıkarmak seriyi hem daha değerli hem enflasyona karşı daha duyarlı
    # yapıyor — ve bir çalıştırma hata verirse ay tamamen boş kalmıyor.
    # Ayın 5'i bilinçli: TÜİK enflasyon verisini her ayın 3'ünde
    # açıklıyor, 5'inde çekince o ayın resmî rakamı taze geliyor.
    # Aralık 15-16 gün — gecmis.py'nin 10 günlük eşiğinin üstünde.
    - cron: "0 6 5,20 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v5

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install -r scraper/requirements.txt

      - name: Playwright Chromium kur
        run: playwright install --with-deps chromium

      - name: Kazıma motorunu çalıştır
        working-directory: scraper
        run: python motor.py

      # Her vertikal icin agrega + sayfa uretimi. Yeni vertikal eklenince
      # buraya tek kelime eklemek yeterli - sayfa_uret ayrica sitemap'i ve
      # ana sayfayi TUM vertikalleri okuyarak urettigi icin ek adim gerekmez.
      - name: Kaynakları birleştir
        working-directory: scraper
        run: |
          for vertikal in dugun ev-kurma okul bebek kedi kopek arac; do
            echo "--- $vertikal ---"
            python agrega.py --vertikal "$vertikal"
          done

      # SIRA KRITIK - gecmis.py SAYFA URETIMINDEN ONCE calismali.
      #
      # 2026-08-09'da bulundu. Once gecmis.py en sonda kosuyordu ve sonuc
      # suydu: sayfalar uretilirken zaman serisi HENUZ O AYKI OLCUMU
      # ICERMIYORDU, yani "Fiyat gecmisi" bolumu HER ZAMAN BIR OLCUM
      # GERIDEYDI. 5 Agustos kosusunda damatlik sayfasi hala "kendi
      # olcumumuz yeni basladi, ilk karsilastirmali rakamlar bir sonraki
      # olcumde gorunecek" diyordu - oysa seride 07-24 ve 08-05 kayitlari
      # vardi ve karsilastirma uretilebilirdi.
      #
      # Bu, projenin en cok beklenen ciktisini (ilk zaman serisi sonucu)
      # sessizce bir tur geciktiriyordu. Hicbir sey hata vermiyordu.
      - name: Fiyat geçmişini derle (sayfa üretiminden ÖNCE)
        working-directory: scraper
        run: python gecmis.py

      - name: Statik sayfaları üret
        working-directory: scraper
        run: |
          for vertikal in dugun ev-kurma okul bebek kedi kopek arac; do
            python sayfa_uret.py --vertikal "$vertikal"
          done

      # Resmi TUFE verisi (TCMB EVDS). Rehber yazilari bunu okuyup
      # "resmi enflasyonla karsilastirma" bolumunu uretiyor, o yuzden
      # rehber.py'den ONCE calismali. Anahtar repoda DEGIL - GitHub
      # Secrets'tan geliyor; yoksa adim sessizce atlanir ve sayfalarda
      # o bolum hic gorunmez (uydurma rakam yok).
      - name: Resmî enflasyon verisini çek
        working-directory: scraper
        env:
          EVDS_KEY: ${{ secrets.EVDS_KEY }}
        run: |
          if [ -n "$EVDS_KEY" ]; then
            printf '%s' "$EVDS_KEY" > .evds-key
            python enflasyon.py || echo "TÜFE çekilemedi, devam ediliyor."
          else
            echo "EVDS_KEY tanımlı değil - TÜFE adımı atlandı."
          fi

      # Paylasim gorseli: uzerinde vertikal adlari ve kalem sayisi var,
      # veri degisince bayatlamamali. PIL yoksa adim sessizce geciyor.
      # Kartlar HTML'den once uretilir: ayni commit'te eklenen yeni sayfa
      # ilk gunden kendi og:image'ini kullanabilsin, ikinci olcumu beklemesin.
      - name: Paylaşım görselini güncelle
        working-directory: scraper
        run: |
          python og_gorsel.py || echo "OG gorseli guncellenemedi, devam."
          # Sayfaya OZEL paylasim kartlari (2026-08-02). Rakam tasidiklari
          # icin HER olcumde yenilenmeli - bayat kart, bayat rakam demek
          # ve WhatsApp/Facebook onbellege alir.
          python -c "import og_gorsel; print(og_gorsel.tum_kartlar(), 'kart')" \
            || echo "Paylasim kartlari uretilemedi, devam."

      # Senaryo sayfalari (100 kisilik dugun, beyaz esya butcesi...).
      # sayfa_uret'ten SONRA: endeks sayfalari bu dosyalarin varligina
      # bakip ic link veriyor, sitemap de oyle.
      # Evcil hayvan hub'i: kedi ve kopek vertikallerini yan yana
      # gosterir (toplamaz). sayfa_uret'ten SONRA - vertikal ozetlerini
      # okuyor ve sitemap onun varligina bakiyor.
      - name: Evcil hayvan hub'ını üret
        working-directory: scraper
        run: python evcil_hub.py

      - name: Senaryo sayfalarını üret
        working-directory: scraper
        run: python senaryo.py

      # Rehber (blog) yazilari: metin elle yazili, RAKAMLAR veriden gelir.
      # Her olcumde yeniden uretiliyor ki yazidaki tutarlar bayatlamasin.
      # sayfa_uret'ten SONRA calismali - sitemap ve ana sayfa rehber
      # dosyalarinin varligina bakiyor.
      - name: Rehber yazılarını üret
        working-directory: scraper
        run: |
          python rehber.py
          python sayfa_uret.py --vertikal dugun   # sitemap + ana sayfa tazelensin

      # CSV disa aktarim + /veri/ indirme merkezi. Alintilanabilirligin
      # merkezi: gazeteci/arastirmaci hazir dosya ariyor.
      - name: Veriyi CSV olarak dışa aktar
        working-directory: scraper
        run: python veri_disa_aktar.py

      # Hesaplayicilar (/hesap/...). Cogunlugu mevzuat ya da matematikten
      # turetir; alim gucu ve "Butcem Yeter mi?" araclari ise guncel veri
      # dosyalarini okur. Bu nedenle veri birlestirildikten sonra uretilir.
      - name: Formül hesaplayıcılarını üret
        working-directory: scraper
        run: python hesaplayicilar.py

      # Sosyal medya: bu olcumde paylasilacak GERCEK bir sey var mi?
      #
      # Metin uretilmiyor, veriden kuruluyor (asistan.py ile ayni ilke) ve
      # SUSMAK VARSAYILAN DAVRANIS - orneklem gurultusunu "fiyat %40 dustu"
      # diye paylasmak, sitenin tum guven iddiasini yakardi.
      #
      # `--gonder` verili ama X/Bluesky secret'lari yoksa hicbir yere
      # gonderilmez; yalnizca veri/sosyal/onizleme.md yazilir ve commit'e
      # girer. Yani otomasyon, Yavuz secret ekleyene kadar haftalarca
      # "provayi" gorunur sekilde yapiyor - anahtari eklemek yayina alma
      # kararinin kendisi (EVDS'deki desenin aynisi).
      #
      # Ozet gonderisi yalnizca ayin 5'inde: ayni ay icinde vertikal
      # rotasyonu deterministik oldugu icin 20'sinde de calistirilsa AYNI
      # ozeti ikinci kez atardi.
      - name: Sosyal medya gönderisi
        working-directory: scraper
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_SIFRE: ${{ secrets.BLUESKY_SIFRE }}
        run: |
          if [ "$(date -u +%d)" = "05" ]; then
            python sosyal.py --gonder --ozet-vertikali auto
          else
            python sosyal.py --gonder
          fi

      - name: Değişiklikleri commit et ve pushla
        id: commit
        run: |
          git config user.name "maliyetine-bot"
          git config user.email "actions@users.noreply.github.com"
          # DIKKAT: uretilen HER yol burada olmali. `sss/` bir kez
          # unutulmustu - sayfa veriye gore degistigi halde commit
          # edilmedigi icin canlida bayat kalirdi (sessiz bayatlama,
          # bu projede daha once yasanan hata sinifi).
          git add scraper/veri scraper/kaynak_gecmisi.json veri \
                  index.html sitemap.xml llms.txt ai.txt robots.txt \
                  assets \
                  dugun ev-kurma okul bebek kedi kopek arac evcil-hayvan rehber hesap sss
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
            echo "degisti=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Aylık veri güncellemesi $(date -u +%Y-%m-%d)"
            git push
            echo "degisti=true" >> "$GITHUB_OUTPUT"
          fi

      # IndexNow: arama motorlarina "bu sayfalar degisti" bildirimi.
      # ChatGPT'nin web aramasi Bing altyapisini kullandigi icin GEO
      # acisindan dogrudan kazanc (Google IndexNow'u desteklemiyor,
      # o Search Console'dan sitemap ile besleniyor).
      # Yalnizca gercekten degisiklik olduysa calisir - bos bildirim
      # gondermek hem gereksiz hem motorlarda guven kaybettirir.
      # Deploy'un tamamlanmasi icin kisa bir bekleme: IndexNow key
      # dogrulamasi ve motorlarin taramasi canli icerige bakiyor.
      - name: IndexNow bildirimi
        if: steps.commit.outputs.degisti == 'true'
        working-directory: scraper
        run: |
          sleep 90
          python indexnow.py
